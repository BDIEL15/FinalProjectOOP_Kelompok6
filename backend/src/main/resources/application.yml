server:
  address: 127.0.0.1
  port: 8081
  servlet.session.cookie:
    http-only: true
    same-site: lax
    secure: false
spring:
  application.name: mars-reboot-backend
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: jdbc:h2:file:./data/mars-reboot;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate.ddl-auto: update
  h2.console.enabled: false
