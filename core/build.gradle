[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
eclipse.project.name = appName + '-core'

dependencies {
  api "com.badlogicgames.gdx:gdx:$gdxVersion"

  if(enableGraalNative == 'true') {
    implementation "io.github.berstanio:gdx-svmhelper-annotations:$graalHelperVersion"
  }
}

// Dependency-free behavior checks: available through the normal Gradle verification lifecycle.
tasks.register('controlTest', JavaExec) {
  group = 'verification'
  description = 'Checks astronaut movement, collision, interaction and modal input without OpenGL.'
  dependsOn testClasses
  classpath = sourceSets.test.runtimeClasspath
  mainClass = 'com.marsreboot.habitat.HabitatControlTest'
}
check.dependsOn controlTest

jar {
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
